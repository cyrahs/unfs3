name: Build image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/image.yml
      - Dockerfile

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cyrahs/unfs3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:0.11.0
            ${{ env.IMAGE_NAME }}:0.11.0-${{ github.sha }}

      - name: Record digest
        run: echo '`${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
